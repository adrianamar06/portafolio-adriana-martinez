<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Session | Adriana Martinez</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="strengths.html">About My Work</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="pricing.html">Pricing</a></li>
                <li><a href="book.html" class="active">How to Book</a></li>
            </ul>
        </nav>
    </header>

    <main class="editorial-page">
        <section class="about-layout">
            
            <div class="about-image-side">
                <img src="assets/images/grad4.jpg" alt="USF Graduation Cap Toss Celebration" class="editorial-img">
            </div>

            <div class="about-text-side">
                <h1 class="section-title">Let's Connect</h1>
                <p class="editorial-lead">Ready to secure your spot? Fill out the details below, and let's bring your vision to life.</p>
                
                <div class="booking-form-container">
                    <form id="bookingForm" class="editorial-form">
                        
                        <div class="form-input-group">
                            <label for="name">Your Name</label>
                            <input type="text" id="name" name="name" placeholder="First and Last Name" required>
                        </div>

                        <div class="form-input-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
                        </div>

                        <div class="form-input-group">
                            <label for="duration">Desired Session Window</label>
                            <select id="duration" name="duration" required>
                                <option value="" disabled selected>Select your timeline...</option>
                                <option value="1-hour">1 Hour Session — $80</option>
                                <option value="2-hour">2 Hour Session — $120</option>
                            </select>
                        </div>

                        <div class="form-input-group">
                            <label for="type">Session Layout</label>
                            <select id="type" name="type" required>
                                <option value="" disabled selected>Who are we shooting?</option>
                                <option value="solo">Solo / Individual Session</option>
                                <option value="group">Group / Squad Session</option>
                            </select>
                        </div>

                        <div class="form-input-group">
                            <label for="ideas">Vision & Props</label>
                            <textarea id="ideas" name="ideas" rows="4" placeholder="Tell me about your favorite USF landmarks, outfit changes, or celebratory props you plan to bring (champagne, confetti, stoles, etc.)..."></textarea>
                        </div>

                        <button type="submit" class="submit-gold-btn">Send Booking Request</button>

                    </form>
                </div>
            </div>

        </section>
    </main>
<script>
        document.getElementById('bookingForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // Prevents the page from refreshing awkwardly

            // Gather the data out of your custom form fields
            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                duration: document.getElementById('duration').value,
                type: document.getElementById('type').value,
                ideas: document.getElementById('ideas').value
            };

            try {
                // Shoot the data across your local API endpoint tunnel
                const response = await fetch('/api/book', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();

                if (result.success) {
                    alert('🎉 Your booking request has been sent! Adriana will reach out within 2 weeks.');
                    document.getElementById('bookingForm').reset(); // Clear form fields
                } else {
                    alert('❌ Something went wrong: ' + result.message);
                }
            } catch (error) {
                console.error('Submission error:', error);
                alert('❌ Unable to connect to the backend server right now.');
            }
        });
    </script>
</body>
</html>
