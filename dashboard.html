<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Client-Side Image Compression Library -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Hub | Admin Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <nav class="navbar" style="justify-content: space-between; padding: 2rem 8%;">
            <h2 class="client-name" style="font-size: 1.8rem;">Admin Control</h2>
            <ul class="nav-links">
                <li><a href="#" id="logoutBtn">Exit Session</a></li>
            </ul>
        </nav>
    </header>

    <main class="editorial-page">
        <section class="about-layout" id="dashboardContent" style="display: none;">
            
            <div class="about-image-side" style="height: auto; background-color: #fafafa; padding: 2.5rem; border-radius: 6px; box-sizing: border-box; border: 1px solid #f0f0f0;">
                <h2 class="section-title" style="font-size: 2.8rem; color: var(--gold);">Overview</h2>
                <p class="editorial-lead" style="font-size: 1.1rem; margin-bottom: 2rem;">Manage incoming milestones.</p>
                <div class="feature-item" style="background: white; border-radius: 4px; padding: 1.5rem; box-shadow: 0 4px 15px rgba(0,0,0,0.01);">
                    <h3 style="margin: 0 0 0.5rem 0; font-family: var(--font-serif); font-size: 1.4rem;">USF Niche Tracking</h3>
                    <p>Review details, coordinate stoles and props, and update status codes directly into your cloud repository layer.</p>
                </div>
            </div>

            <div class="about-text-side">
                <h1 class="section-title">Inbound Requests</h1>
                <p class="editorial-lead">Real-time repository query streams sorted by submission timeline.</p>
                
                <div id="bookingsContainer" class="editorial-features-list">
                </div>
            </div>

        </section>
    </main>

    <script>
        // Security Gatekeeper: Ensure user has a verified cookie session before rendering
        async function checkAuth() {
            try {
                const res = await fetch('/api/admin/check-session');
                const data = await res.getRawJson ? await res.getRawJson() : await res.json();
                if (!data.loggedIn) {
                    window.location.href = '/login.html';
                } else {
                    document.getElementById('dashboardContent').style.display = 'flex';
                    fetchBookings();
                }
            } catch (err) {
                window.location.href = '/login.html';
            }
        }

        // Fetch client list from MongoDB data engine
        async function fetchBookings() {
            try {
                const res = await fetch('/api/admin/bookings');
                const data = await res.json();
                if (data.success) {
                    renderBookings(data.bookings);
                }
            } catch (err) {
                console.error("Error reading repository:", err);
            }
        }

        // Render documents into beautifully styled UI cards with asset optimization pipelines
        function renderBookings(bookings) {
            const container = document.getElementById('bookingsContainer');
            if(bookings.length === 0) {
                container.innerHTML = `<p style="font-family: var(--font-clean); color: #888;">No booking requests found in database.</p>`;
                return;
            }

            container.innerHTML = bookings.map(b => {
                // Pre-render safely mapped list elements for existing optimized gallery assets
                const photoElements = b.optimizedPhotos && b.optimizedPhotos.length > 0
                    ? b.optimizedPhotos.map(url => `
                        <div style="display: flex; align-items: center; background: #fff; padding: 0.4rem 0.8rem; border-radius: 4px; border: 1px solid #eaeaea; font-size: 0.85rem; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; gap: 0.5rem;">
                            <span style="color: #4caf50;">✓</span>
                            <a href="${url}" target="_blank" style="color: #555; text-decoration: none; overflow: hidden; text-overflow: ellipsis;">${url}</a>
                        </div>
                    `).join('')
                    : `<p style="font-size: 0.85rem; color: #aaa; margin: 0; font-style: italic;">No media assets linked yet.</p>`;

                return `
                <div class="feature-item" style="position: relative; margin-bottom: 2rem; padding: 2rem;">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem;">
                        <div>
                            <h3 style="font-size: 1.5rem; margin-bottom: 0.2rem;">${b.name}</h3>
                            <p style="color: var(--gold); font-weight: 600; font-size: 0.95rem; margin: 0 0 1rem 0;">${b.email}</p>
                        <!-- Upgraded File Selector & Compression UI Block -->
                    <div class="photo-uploader-box" style="display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1rem;">
                        <div style="display: flex; gap: 0.5rem; align-items: center;">
                            <input type="file" id="file-upload-${b._id}" accept="image/*" style="font-family: var(--font-clean); font-size: 0.9rem; flex: 1;">
                            <button onclick="processAndUploadPhoto('${b._id}')" id="upload-btn-${b._id}" style="font-family: var(--font-clean); background: var(--text-dark); color: #fff; border: none; padding: 0.5rem 1.2rem; border-radius: 4px; font-weight: 600; cursor: pointer; transition: background 0.2s;">
                                Compress & Upload
                            </button>
                        </div>
                        <!-- Tiny status message area to show compression progress -->
                        <span id="upload-status-${b._id}" style="font-size: 0.85rem; color: #888; font-style: italic; display: none;"></span>
                    </div>
                        </div>
                        <select onchange="updateStatus('${b._id}', this.value)" style="font-family: var(--font-clean); padding: 0.4rem 0.8rem; border-radius: 4px; border: 1px solid #e0e0e0; background: #fff; font-weight: 600; color: var(--text-dark); cursor: pointer;">
                            <option value="Pending" ${b.status === 'Pending' ? 'selected' : ''}>Pending</option>
                            <option value="Approved" ${b.status === 'Approved' ? 'selected' : ''}>Approved</option>
                            <option value="Archived" ${b.status === 'Archived' ? 'selected' : ''}>Archived</option>
                        </select>
                    </div>
                    
                    <p style="margin: 0.5rem 0;"><strong>Setup:</strong> ${b.duration || 'Standard'} session • ${b.type || 'Custom'} layout</p>
                    ${b.ideas ? `<p style="background: #fafafa; padding: 0.8rem; border-radius: 4px; font-size: 0.95rem; border-left: 2px solid #e0e0e0; color: #555; margin-top: 0.5rem; margin-bottom: 1.5rem;">"${b.ideas}"</p>` : ''}
                    
                    <hr style="border: 0; border-top: 1px solid #f0f0f0; margin: 1.5rem 0;">

                    <!-- Media Optimization & Feature Highlight Section -->
                    <div class="media-management-block" style="margin-top: 1rem;">
                        <h4 style="font-family: var(--font-serif); font-size: 1.1rem; margin: 0 0 0.75rem 0; color: #333;">Optimized Client Media Pipeline</h4>
                        
                        <!-- Upload Integration Layout -->
                        <div class="photo-uploader-box" style="display: flex; gap: 0.5rem; margin-bottom: 1rem;">
                            <input type="text" id="photo-url-${b._id}" placeholder="Paste optimized CDN or Cloudinary photo URL..." style="flex: 1; font-family: var(--font-clean); padding: 0.5rem; border: 1px solid #e0e0e0; border-radius: 4px; font-size: 0.9rem;">
                            <button onclick="linkPhoto('${b._id}')" style="font-family: var(--font-clean); background: var(--text-dark); color: #fff; border: none; padding: 0.5rem 1.2rem; border-radius: 4px; font-weight: 600; cursor: pointer; transition: background 0.2s;">Link Asset</button>
                        </div>

                        <!-- Active Live Gallery Stream Component -->
                        <div style="display: flex; flex-direction: column; gap: 0.4rem; background: #fafafa; padding: 1rem; border-radius: 4px; border: 1px solid #f0f0f0;">
                            <p style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: #888; font-weight: 600; margin: 0 0 0.5rem 0;">Active Gallery Links</p>
                            <div id="gallery-list-${b._id}" style="display: flex; flex-direction: column; gap: 0.4rem;">
                                ${photoElements}
                            </div>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        // Send runtime update payload requests across the API server channel
        async function updateStatus(id, newStatus) {
            try {
                const res = await fetch(`/api/admin/bookings/${id}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Failed status patch interaction.');
            } catch (err) {
                alert('Failed to execute update lifecycle status changes: ' + err.message);
            }
        }

        // Link an optimized cloud delivery network photo URL directly into the MongoDB document structure
// Intercept, compress, and upload images dynamically
async function processAndUploadPhoto(bookingId) {
    const fileInput = document.getElementById(`file-upload-${bookingId}`);
    const statusText = document.getElementById(`upload-status-${bookingId}`);
    const uploadBtn = document.getElementById(`upload-btn-${bookingId}`);
    const imageFile = fileInput.files[0];

    if (!imageFile) {
        alert('Please select a photo file from your computer first.');
        return;
    }

    // Configure the web compression settings
    const compressionOptions = {
        maxSizeMB: 1,            // Limit the file to a fast-loading maximum of 1MB (down from 10MB+)
        maxWidthOrHeight: 1920,   // Downscale resolution to standard web-crisp dimensions
        useWebWorker: true        // Use background processing to prevent your dashboard from freezing
    };

    try {
        // 1. UI Feedback: Update status to show processing has started
        uploadBtn.disabled = true;
        statusText.style.display = 'block';
        statusText.innerText = 'Optimizing media file on-device...';
        statusText.style.color = 'var(--gold)';

        // 2. Compress the file right inside the browser
        const compressedBlob = await imageCompression(imageFile, compressionOptions);
        
        statusText.innerText = 'Uploading optimized asset to cloud pipeline...';
        
        // 3. Convert the compressed file into a Base64 Data URL string to pass via JSON
        const reader = new FileReader();
        reader.readAsDataURL(compressedBlob);
        reader.onloadend = async () => {
            const base64DataUri = reader.result;

            // 4. Send the lightweight optimized asset to your backend server
            const response = await fetch(`/api/bookings/${bookingId}/photos`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ photoUrl: base64DataUri })
            });
            
            const data = await response.json();
            
            if (response.ok && data.success) {
                statusText.innerText = 'Asset attached flawlessly!';
                statusText.style.color = '#4caf50';
                fileInput.value = ''; // Reset file slot
                setTimeout(() => { statusText.style.display = 'none'; }, 3000);
                fetchBookings(); // Refresh gallery display
            } else {
                throw new Error(data.error || 'Failed upload pipeline.');
            }
        };
    } catch (err) {
        console.error('Optimization error:', err);
        alert('Compression or upload pipeline failure: ' + err.message);
    } finally {
        uploadBtn.disabled = false;
    }
}

        // Close session processing
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await fetch('/api/admin/logout', { method: 'POST' });
            window.location.href = '/login.html';
        });

        // Run security checks on launch
        checkAuth();
    </script>
</body>
</html>
